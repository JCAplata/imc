<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de IMC</title>
  <script type="module" src="contenido/app.js"></script>
  <link rel="stylesheet" href="contenido/style.css" />
</head>
<body>
  <div class="container">
    <h1>Calculadora de IMC</h1>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" placeholder="Tu nombre"/>

    <label for="edad">Edad:</label>
    <input type="number" id="edad" placeholder="Tu edad"/>

    <label for="peso">Peso (kg):</label>
    <input type="number" id="peso" placeholder="Ej: 70"/>

    <label for="altura">Estatura (m):</label>
    <input type="number" id="altura" step="0.01" placeholder="Ej: 1.75"/>

    <div class="botones">
      <button id="calcular">Calcular</button>
      <button id="nuevo">Nuevo</button>
    </div>
    <div id="resultado"></div>
  </div>
</body>
</html>
